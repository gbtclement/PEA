# Tests de bout en bout quand .env vise un vrai SMTP (Brevo) : les mails vont dans Mailpit, où auth.spec.ts lit le code.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait api worker && docker compose restart web
# Pour revenir au SMTP de .env : docker compose up -d --wait api worker && docker compose restart web
services:
  api:
    environment: &mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_TLS: none
  worker:
    environment: *mailpit
