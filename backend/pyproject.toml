[project]
name = "pea-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "yfinance>=1.7",
  "pandas>=2.2",
  "apscheduler>=3.10,<4",
  "tzdata",
  "anthropic>=0.116",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "email-validator>=2.2",
  "joserfc>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seeds" = ["*.csv"]
"app.services.mail" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: appelle de vrais services externes (exclu par défaut)"]
addopts = "-m 'not network'"
