server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_http_version 1.1;
    # la réflexion de Claude peut rester silencieuse plus de 60 s
    proxy_read_timeout 600s;
  }

  # Fichiers de référencement générés par l'API (robots.txt interdit tout tant que SEO_INDEXING=false)
  location = /robots.txt { proxy_pass http://api:8000/api/seo/robots.txt; }
  location = /sitemap.xml { proxy_pass http://api:8000/api/seo/sitemap.xml; }
  location = /llms.txt { proxy_pass http://api:8000/api/seo/llms.txt; }

  # Documentation Docsify (fichiers statiques de public/documentation, hors du routeur React).
  # Redirection relative : le port publié (8095) n'est pas celui d'écoute de nginx (80).
  absolute_redirect off;
  location = /documentation { return 301 /documentation/; }
  location /documentation/ {
    default_type text/markdown;  # .md absent de mime.types
    charset utf-8;
    charset_types text/markdown text/css application/javascript;
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
